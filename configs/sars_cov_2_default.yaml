# General project settings
project_name: "SARS-CoV-2-Spike-Mutation"
protein_name: "SARS-CoV-2 Spike"

# --- OPTIMIZATION SETTINGS ---
optimization:
  enabled: true

  memory:
    use_streaming: true
    use_memory_mapping: false  # Enable if RAM < 4GB
    max_memory_mb: 4096
    gc_frequency: 100
    gc_aggressive: true

  performance:
    use_multiprocessing: true
    n_workers: auto  # Will use cpu_count()
    use_vectorization: true
    cache_enabled: true
    cache_size: 10000

  io:
    file_format: parquet  # csv or parquet
    compression: snappy
    batch_size: 10000

  algorithms:
    use_approximate_nn: false  # Set true for very large datasets
    early_stopping_threshold: 0.95

# --- ERROR HANDLING ---
error_handling:
  # Skip corrupted files instead of stopping entire pipeline
  skip_corrupted_files: true

  # Stop pipeline if too many consecutive files fail (prevents infinite loops)
  max_consecutive_failures: 10

  # Try multiple encodings when UTF-8 fails
  encoding_fallback_chain: ['utf-8', 'latin-1', 'cp1252', 'iso-8859-1']

  # Generate detailed error reports
  save_error_report: true
  error_report_path: "data/processed/error_report.json"

  # Quarantine corrupted files for manual inspection
  quarantine_corrupted_files: true
  quarantine_dir: "data/processed/quarantine"

  # Progress tracking and resumability
  enable_checkpoints: true
  checkpoint_file: "data/processed/pipeline_progress.json"

# --- MEMORY OPTIMIZATION (LEGACY) ---
memory_optimization:
  # Batch sizes for different operations
  data_preparation_batch_size: 5000  # Increased from 1000
  clustering_batch_size: 1000  # Increased from 500
  dataset_creation_batch_size: 500  # Increased from 100
  protvec_batch_size: 50

  # Memory limits
  max_memory_mb: 4096
  gc_frequency: 100  # Garbage collection every N batches

  # I/O optimization
  use_streaming: true
  intermediate_saves: true
  compression: false

# --- PATHS ---
data:
  raw_fasta_file: "data/input/spikeprot0723.fasta"
  prot_vec_file: "data/input/protVec_100d_3grams.csv"
  # Intermediate paths
  temp_fasta_dir: "data/processed/temp_fasta"
  temp_csv_dir: "data/processed/temp_csv"
  periods_dir: "data/processed/periods"
  periods_unique_dir: "data/processed/periods/unique"
  vector_temp_dir: "data/processed/sequences_as_vectors"
  # Output paths
  centroids_file: "data/processed/clusters_centroids.csv"
  linked_centroids_file: "data/processed/linked_clusters_centroids.csv"
  final_dataset_dir: "data/processed/datasets"
  final_dataset_file: "data/processed/final_dataset.csv"

models:
  model_dir: "models"
  model_path: "models/best_model.pth"

results:
  results_dir: "results"
  test_results_path: "results/test_results.json"
  training_plot_path: "results/training_history.png"
  attention_plot_path: "results/attention_weights.png"

# --- PIPELINE STEPS ---

# 1. Prepare Data (from grouping_raw_data.py)
prepare:
  split_fasta:
    start_line: 1  # Start line for processing (allows resuming from specific position)
    lines_per_file: 100000
    max_files: 10000
  # Configurable FASTA filename prefix (replaces hardcoded 'spikeprot_batch_data')
  fasta_prefix: "spikeprot_batch_data"
  clean_sequences:
    # Set to null for auto-detection, or specify exact length for manual mode
#    expected_len: null  # Auto-detect from data (was: 1273)
    expected_len: 1273  # Auto-detect from data (was: 1273)
    # Error margin for length filtering (used with expected_len or auto-detection)
    error_margin: 13
  sort_periods:
    division_technique: "month" # 'month', 'quarter', or 'year'

# 2. Create Clusters (from clustering.py, ClusterCentroidsDataCreator.py)
cluster:
  use_multiprocessing: true
  processes: null # null for all available cores
  
  # Automatic k-selection using Silhouette Score
  auto_k_selection:
    enabled: true
    min_k: 2
    max_k: 19
  
  # Manual cluster configuration (used only if auto_k_selection.enabled = false)
  # This maps a period file to a pre-determined number of clusters.
  # For generalization, this section is now optional when auto_k_selection is enabled.
  clusters_per_period:
    '2020-2.csv': 2
    '2020-3.csv': 2
    '2020-4.csv': 2
    '2020-5.csv': 2
    '2020-6.csv': 2
    '2020-7.csv': 3
    '2020-8.csv': 3
    '2020-9.csv': 4
    '2020-10.csv': 4
    '2020-11.csv': 5
    '2020-12.csv': 6
    '2021-1.csv': 7
    '2021-2.csv': 8
    '2021-3.csv': 8
    '2021-4.csv': 8
    '2021-5.csv': 9
    '2021-6.csv': 10
    '2021-7.csv': 11
    '2021-8.csv': 11
    '2021-9.csv': 12
    '2021-10.csv': 14
    '2021-11.csv': 15
    '2021-12.csv': 16
    '2022-1.csv': 18

# 3. Link Clusters (from ClusterLinker.py) - No extra params needed

# 4. Create Dataset (from EpitopeDataCreator.py)
create_dataset:
  window_size: 10
  context_size: 2
  epitopes: [
    [194, 210], [291, 325], [307, 323], [371, 387], [410, 426], [525, 566],
    [530, 544], [722, 739], [747, 763], [749, 771], [754, 770], [891, 906],
    [897, 913], [1101, 1115], [1129, 1145], [1213, 1229]
  ]
  epitopes_similarity_threshold: 0.5
  # Total desired samples in the final dataset.
  dataset_size: 1268000 # 317 positions * 400 samples
  # Duplication factor to compensate for high duplicate removal rates
  duplication_factor: 5
  # For refilling dataset to meet ratio
  refiller:
    enabled: true
    max_iterations: 200
    target_mutated_ratio: 0.2
    early_stopping_threshold: 0.95

  # Parallel processing configuration
  parallel:
    enabled: true
    window_workers: 8  # Number of parallel window processors
    sample_workers: 2  # Samples created in parallel per window

  # Checkpointing for resumable processing
  checkpoint:
    enabled: true
    file: "data/processed/dataset_checkpoint.pkl"
    interval: 10  # Save progress every N windows

  # Sequence caching for fast retrieval
  cache:
    enabled: true  # Pre-load all sequences at startup

# 5. Train Model (from training.py, models.py)
train:
  # Model type: 'RNN', 'AttentionRNN', 'DualAttentionRNN', or 'custom'
  model_type: 'DualAttentionRNN'
  
  # Optional: path to custom model (only used if model_type is 'custom')
  # custom_model_path: "path/to/your/custom_model.pth"
  
  # Data split ratios: [train, validation, test]
  split_ratio: [0.7, 0.15, 0.15]
  
  # Whether to compute logistic regression baseline for comparison
  include_baseline: true
  
  # Window size for baseline model (if enabled)
  window_size: 10
  
  # Model saving configuration
  model_saving:
    # Strategy: 'best', 'threshold', or 'both'
    # - 'best': save only the model with best validation MCC
    # - 'threshold': save only if validation MCC meets threshold
    # - 'both': save best model AND threshold model (if threshold met)
    strategy: 'both'
    
    # MCC threshold for saving (used with 'threshold' or 'both' strategies)
    mcc_threshold: 0.7
    
    # Always save best model when using 'both' strategy
    always_save_best: true
  
  # Hyperparameters for each model type (no defaults - must specify all)
  hyperparameters:
    AttentionRNN:
      hidden_size: 256
      dropout: 0.2
      learning_rate: 0.0005
      batch_size: 256
      epochs: 200
      # Optional training parameters
      print_interval: 10  # Log progress every N epochs
    
    RNN:
      hidden_size: 256
      dropout: 0.2
      learning_rate: 0.001
      batch_size: 256
      epochs: 100
      print_interval: 10
    
    DualAttentionRNN:
      hidden_size: 256
      dropout: 0.2
      learning_rate: 0.01
      batch_size: 256
      epochs: 400
      print_interval: 10