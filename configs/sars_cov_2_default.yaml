# --- DATA FORMAT SPECIFICATION ---
# Configure this section to match your virus FASTA file format
# This configuration is for SARS-CoV-2 spike protein sequences
data_format:
  # Header parsing configuration
  fasta_header:
    # Parsing method: 'delimiter' or 'regex'
    method: 'delimiter'

    # Delimiter used to separate fields in FASTA headers
    delimiter: '|'

    # Field mapping: map position (after delimiter split) to semantic meaning
    fields:
      gene: 0           # Position of gene/protein name
      isolate: 1        # Position of isolate/strain name
      timestamp: 2      # Position of date/timestamp
      accession: 3      # Position of accession or other ID

  # Timestamp/date parsing
  date_format:
    # Input format: how dates appear in your FASTA file
    # Options: 'YYYY-MM-DD', 'YYYY-MM', 'YYYY', or strftime pattern
    input_format: 'YYYY-MM-DD'

    # Default values for missing date components
    defaults:
      month: '01'  # Default month if not specified
      day: '01'    # Default day if not specified

    # Period grouping: how to group sequences by time
    # Options: 'year', 'quarter', 'month', 'week'
    grouping: 'month'

  # Sequence validation and filtering
  sequence_validation:
    # Require sequences to end with stop codon '*'
    require_stop_codon: true

    # Filter out sequences with ambiguous amino acids (X, B, Z, J)
    filter_ambiguous: true
    ambiguous_threshold: 0.0  # Max proportion of ambiguous residues (0.0 = none allowed)

    # Expected sequence type
    sequence_type: 'amino_acid'

# --- OPTIMIZATION SETTINGS ---
optimization:
  memory:
    # Memory limits
    max_memory_mb: 4096
    gc_frequency: 100  # Garbage collection every N batches
    # I/O optimization
    use_streaming: true
    intermediate_saves: true
    # Batch sizes for different operations
    data_preparation_batch_size: 5000
    clustering_batch_size: 1000
    dataset_creation_batch_size: 500
    protvec_batch_size: 50

  performance:
    use_multiprocessing: true
    # n_workers determined automatically using cpu_count()

  algorithms:
    use_approximate_nn: false  # Set true for very large datasets

# --- ERROR HANDLING ---
error_handling:
  # Skip corrupted files instead of stopping entire pipeline
  skip_corrupted_files: true

  # Stop pipeline if too many consecutive files fail (prevents infinite loops)
  max_consecutive_failures: 10

  # Try multiple encodings when UTF-8 fails
  encoding_fallback_chain: ['utf-8', 'latin-1', 'cp1252', 'iso-8859-1']

  # Generate detailed error reports
  save_error_report: true
  error_report_path: "data/processed/error_report.json"

  # Quarantine corrupted files for manual inspection
  quarantine_corrupted_files: true
  quarantine_dir: "data/processed/quarantine"

  # Progress tracking and resumability
  enable_checkpoints: true
  checkpoint_file: "data/processed/pipeline_progress.json"


# --- PATHS ---
data:
  raw_fasta_file: "data/input/spikeprot0723.fasta"
#  raw_fasta_file: "data/input/influenza_ha_h1n1.fasta"  # Example: switch to influenza
  prot_vec_file: "data/input/protVec_100d_3grams.csv"
  # Intermediate paths
  temp_fasta_dir: "data/processed/temp_fasta"
  temp_csv_dir: "data/processed/temp_csv"
  periods_dir: "data/processed/periods"
  periods_unique_dir: "data/processed/periods/unique"
  vector_temp_dir: "data/processed/sequences_as_vectors"
  # Output paths
  centroids_file: "data/processed/covid_clusters_centroids.csv"
  linked_centroids_file: "data/processed/covid_linked_clusters_centroids.csv"
  final_dataset_dir: "data/processed/datasets"
  final_dataset_file: "data/processed/final_dataset_covid.csv"

models:
  model_dir: "models"
  model_path: "models/best_model.pth"

results:
  results_dir: "results"
  test_results_path: "results/test_results.json"
  training_plot_path: "results/training_history.png"
  attention_plot_path: "results/attention_weights.png"

# --- PIPELINE STEPS ---

# 1. Prepare Data (from grouping_raw_data.py)
prepare:
  split_fasta:
    start_line: 1  # Start line for processing (allows resuming from specific position)
    lines_per_file: 10000
    max_files: 10
  # Configurable FASTA filename prefix
  fasta_prefix: "batch_data"
  clean_sequences:
    # Expected sequence length (in amino acids)
    expected_len: 1273  # SARS-CoV-2 Spike protein length
    # Error margin for length filtering (used with expected_len or auto-detection)
    error_margin: 13
  sort_periods:
    division_technique: "month" # 'month', 'quarter', or 'year'

# 2. Create Clusters (from clustering.py, ClusterCentroidsDataCreator.py)
cluster:
  use_multiprocessing: true
  processes: null # null for all available cores
  
  # Automatic k-selection using Silhouette Score
  auto_k_selection:
    enabled: true
    min_k: 2
    max_k: 19
  
  # Manual cluster configuration (used only if auto_k_selection.enabled = false)
  # This maps a period file to a pre-determined number of clusters.
  # For generalization, this section is now optional when auto_k_selection is enabled.
  clusters_per_period:
    '2020-02.csv': 2
    '2020-03.csv': 2
    '2020-04.csv': 2
    '2020-05.csv': 2
    '2020-06.csv': 2
    '2020-07.csv': 3
    '2020-08.csv': 3
    '2020-09.csv': 4
    '2020-10.csv': 4
    '2020-11.csv': 5
    '2020-12.csv': 6
    '2021-01.csv': 7
    '2021-02.csv': 8
    '2021-03.csv': 8
    '2021-04.csv': 8
    '2021-05.csv': 9
    '2021-06.csv': 10
    '2021-07.csv': 11
    '2021-08.csv': 11
    '2021-09.csv': 12
    '2021-10.csv': 14
    '2021-11.csv': 15
    '2021-12.csv': 16
    '2022-01.csv': 18

# 3. Link Clusters (from ClusterLinker.py) - No extra params needed

# 4. Create Dataset (from EpitopeDataCreator.py)
create_dataset:
  window_size: 10
  context_size: 2
  # SARS-CoV-2 Spike protein epitopes
  epitopes: [
    [194, 210], [291, 325], [307, 323], [371, 387], [410, 426], [525, 566],
    [530, 544], [722, 739], [747, 763], [749, 771], [754, 770], [891, 906],
    [897, 913], [1101, 1115], [1129, 1145], [1213, 1229]
  ]
  epitopes_similarity_threshold: 0.5
  # Target number of rows in the FINAL dataset (after deduplication)
  dataset_size: 12680 # Target rows after removing duplicates
  # Duplication factor to compensate for high duplicate removal rates
  duplication_factor: 5
  # Expected duplicate rate (0.8 = 80% duplicates expected)
  # Used to better estimate initial overproduction needed
  expected_duplicate_rate: 0.8
  # Refiller: Iteratively creates samples to reach TWO MANDATORY goals:
  #   Goal 1: Reach target dataset_size (configurable via dataset_size parameter)
  #   Goal 2: Reach target_mutated_ratio (configurable below)
  # BOTH goals must be met (or balancing will be applied to achieve ratio goal)
  # The only early stop is via no_improvement_max_iterations
  refiller:
    enabled: true

    # === STOPPING CONDITIONS ===
    # Maximum refilling iterations before stopping
    max_iterations: 10

    # Stop if no improvement for this many consecutive iterations
    # This is the ONLY way to exit without meeting both goals
    no_improvement_max_iterations: 3

    # === MUTATION RATIO GOAL (MANDATORY) ===
    # Target mutation ratio to achieve (0.2 = 20% mutated samples)
    # This is a REQUIRED goal - balancing will be applied if not achieved via sampling
    target_mutated_ratio: 0.2

    # Tolerance for mutation ratio (0.95 = accept 19% when target is 20%)
    ratio_tolerance: 0.95

    # === BALANCING METHOD ===
    # Applied if ratio cannot be achieved through sampling alone
    # Options:
    #   'downsample_majority': Remove non-mutated samples (reduces dataset size)
    #   'oversample_minority': Duplicate mutated samples (increases dataset size)
    #   'none': No balancing (accept whatever ratio was achieved)
    balancing_method: 'downsample_majority'

  # Parallel processing configuration
  parallel:
    enabled: true
    window_workers: 8  # Number of parallel window processors
    sample_workers: 2  # Samples created in parallel per window

  # Checkpointing for resumable processing
  checkpoint:
    enabled: true
    file: "data/processed/dataset_checkpoint.pkl"
    interval: 10  # Save progress every N windows

  # Sequence caching for fast retrieval
  cache:
    enabled: true  # Pre-load all sequences at startup

# 5. Train Model (from training.py, models.py)
train:
  # Model type: 'RNN', 'AttentionRNN', 'DualAttentionRNN', or 'custom'
  model_type: 'DualAttentionRNN'

  # Optional: path to custom model (only used if model_type is 'custom')
  # custom_model_path: "path/to/your/custom_model.pth"

  # Device configuration for training
  # Options: 'auto', 'cpu', 'cuda', 'mps'
  # - 'auto': Automatically select best available device (cuda > mps > cpu)
  # - 'cpu': Force CPU training
  # - 'cuda': Use NVIDIA GPU (requires CUDA-enabled PyTorch)
  # - 'mps': Use Apple Metal GPU (requires MPS-enabled PyTorch on macOS)
  device: 'auto'

  # Split strategy: 'random' or 'chronological'
  split_strategy: 'chronological'  # Changed to chronological to prevent data leakage

  # Data split ratios: [train, validation, test] - Used for both strategies
  split_ratio: [0.8, 0.1, 0.1]

  # Chronological split configuration (only used when split_strategy is 'chronological')
  chronological_split:
    # Method: 'percentage' or 'fixed_periods'
    method: 'percentage'
    # Percentage-based split (uses split_ratio above)
    # The split_ratio will be applied to the ordered time periods
    # Example: with 20 periods and [0.7, 0.15, 0.15]:
    #   - Train: periods 1-14 (70%)
    #   - Val: periods 15-17 (15%)
    #   - Test: periods 18-20 (15%)

    # Alternative: Fixed period ranges (uncomment to use)
    # method: 'fixed_periods'
    # train_periods: ['2020-2', '2021-6']  # Start and end periods for training
    # val_periods: ['2021-7', '2021-10']   # Start and end periods for validation
    # test_periods: ['2021-11', '2022-1']  # Start and end periods for testing

    # Minimum samples per split (to ensure adequate data)
    min_samples_per_split: 100

    # Whether to log detailed period assignments
    verbose_logging: true

  # Whether to compute logistic regression baseline for comparison
  include_baseline: true
  
  # Window size for baseline model (if enabled)
  window_size: 10
  
  # Model saving configuration
  model_saving:
    # Strategy: 'best', 'threshold', or 'both'
    # - 'best': save only the model with best validation MCC
    # - 'threshold': save only if validation MCC meets threshold
    # - 'both': save best model AND threshold model (if threshold met)
    strategy: 'both'
    
    # MCC threshold for saving (used with 'threshold' or 'both' strategies)
    mcc_threshold: 0.7
    
    # Always save best model when using 'both' strategy
    always_save_best: true
  
  # Hyperparameters for each model type (no defaults - must specify all)
  hyperparameters:
    AttentionRNN:
      hidden_size: 256
      dropout: 0.2
      learning_rate: 0.0005
      batch_size: 256
      epochs: 200
      # Optional training parameters
      print_interval: 10  # Log progress every N epochs
    
    RNN:
      hidden_size: 256
      dropout: 0.2
      learning_rate: 0.001
      batch_size: 256
      epochs: 100
      print_interval: 10
    
    DualAttentionRNN:
      hidden_size: 256
      dropout: 0.2
      learning_rate: 0.001
      batch_size: 128
      epochs: 100
      print_interval: 5